name: build

on:
  push:
    branches: [main]
    paths: ['**.py', 'pyproject.toml', 'uv.lock', '.github/workflows/**']
  pull_request:
    branches: [main]
    paths: ['**.py', 'pyproject.toml', 'uv.lock', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install lint toolchain
        run: uv sync --only-group lint

      - name: Ruff
        continue-on-error: true
        run: |
          uv run --no-sync ruff check . --fix
          uv run --no-sync ruff format .

      - name: MyPy
        continue-on-error: true
        run: uv run --no-sync mypy mujoco_toolbox/

      - name: Commit Fixes if Needed
        if: github.event_name == 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin
          git checkout "${{ github.head_ref }}"

          git add .

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-fix code quality issues [skip ci]"

            # Rebase to avoid merge conflicts
            git pull --rebase origin "${{ github.head_ref }}"

            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:"${{ github.head_ref }}"
          fi

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libosmesa6-dev \
            xvfb \
            libglew-dev \
            patchelf \
            ffmpeg

      - name: Set MuJoCo environment variables
        run: |
          echo "MUJOCO_GL=osmesa" >> $GITHUB_ENV
          echo "PYOPENGL_PLATFORM=osmesa" >> $GITHUB_ENV

      - name: Install project and test dependencies
        run: uv sync --group test

      - name: Run Tests
        run: uv run pytest tests/ --cov=mujoco_toolbox --cov-report=xml --maxfail=3 -v

      # Uncomment below if using codecov
      # - name: Upload Coverage Report
      #   uses: codecov/codecov-action@v7
      #   with:
      #     fail_ci_if_error: true
