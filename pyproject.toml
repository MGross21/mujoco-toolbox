[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mujoco-toolbox"
version = "0.7.0"
requires-python = ">=3.10"
description = "A Modern Simulation Wrapper for Google DeepMind's MuJoCo"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "MGross21", email = "MGross21@example.com" }
]
keywords = ["MuJoCo", "mujoco", "robotics", "simulation", "toolbox", "wrapper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "defusedxml>=0.7.1",
    "imageio[ffmpeg]>=2.28",
    "ipython>=8.0",
    "jinja2>=3.1",
    "matplotlib>=3.7",
    "mujoco>=3.0",
    "numpy>=1.25",
    "pyyaml>=6.0",
    "screeninfo>=0.8.1",
    "tqdm>=4.65",
    "typing-extensions>=4.12; python_version < '3.11'",
]

[project.optional-dependencies]
examples = [
    "ipykernel>=6.25",
    "ipywidgets>=8.0",
]

[project.urls]
homepage = "https://github.com/MGross21/mujoco-toolbox"
repository = "https://github.com/MGross21/mujoco-toolbox"
documentation = "https://mgross21.github.io/mujoco-toolbox/"
changelog = "https://github.com/MGross21/mujoco-toolbox/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/MGross21/mujoco-toolbox/issues"

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]
test = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
]
lint = [
    "mypy>=2.4",
    "ruff>=0.17",
    "typing-extensions>=4.16",
    "pybind11-stubgen>=3.0",
    "types-defusedxml",
    "types-pyyaml",
    "types-tqdm",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=4.0.1",
    "sphinx>=8.1.0",
    "sphinx-copybutton>=0.5.2",
]

[tool.hatch.build.targets.wheel]
packages = ["mujoco_toolbox"]

[tool.hatch.build.targets.sdist]
include = [
    "/mujoco_toolbox",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["docs/_build", "local_testing", "typings"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "T20",
    "INP001",
    "COM812",
    "ISC001",
    "CPY001",
    "D105",
    "D107",
    "PLR0913",
    "PLR0917",
    "FIX002",
    "N817",
]
fixable = ["ALL"]
unfixable = ["ERA001"]

[tool.ruff.lint.isort]
known-first-party = ["mujoco_toolbox"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",
    "D",
    "PLR2004",
    "SLF001",
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
files = ["mujoco_toolbox"]
mypy_path = "typings"
python_version = "3.10"
disallow_untyped_calls = true
disallow_untyped_defs = true
strict_optional = true
warn_unused_ignores = true
untyped_calls_exclude = ["IPython"]

[[tool.mypy.overrides]]
module = ["mujoco.viewer", "screeninfo", "IPython.*"]
ignore_missing_imports = true
